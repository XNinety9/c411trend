name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: python -m pip install cryptography

      - name: Script syntax
        run: python -m py_compile bin/c411trend-fetch

      - name: Manifest is valid JSON with the required fields
        run: |
          jq -e '
            .schemaVersion == 1 and (.id|type) == "string" and (.name|type) == "string"
            and (.version|type) == "string" and (.author|type) == "string"
            and (.description|type) == "string" and (.kinds|type) == "array"
            and (.entryPoints.barWidget|type) == "string"
            and (.barWidget.defaultSection | IN("left", "center", "right"))
          ' manifest.json
          test -f "$(jq -r .entryPoints.barWidget manifest.json)"
          test -z "$(find . -path ./.git -prune -o -type l -print)"

      - name: README does not reference Nerd Font private-use glyphs
        run: |
          if grep -nP '[\x{E000}-\x{F8FF}\x{F0000}-\x{FFFFD}]' README.md README.fr.md SECURITY.md; then
            echo "Private-use glyphs render only with the bar font, not on GitHub." >&2
            exit 1
          fi

      - name: Model tests
        run: node --test test/*.test.mjs

      - name: Fetch script tests
        run: python -m unittest discover -s test -v

      - name: Marketplace security baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: omacom/omarchy-plugin-marketplace
          ref: d45af9a928b7f16278707e093c8b6265192ff00f
          path: .marketplace

      - run: MARKETPLACE_DIR=.marketplace node test/marketplace-baseline.mjs
